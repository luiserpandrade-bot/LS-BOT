# Backend de LS-bot: API (FastAPI) + base de datos (PostgreSQL).
# Uso, dentro de la carpeta backend/:   docker compose up --build
# Las credenciales salen de backend/.env (copia de .env.example, NO se versiona).
services:
  db:
    image: postgres:16-alpine
    container_name: lsbot-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lsbot}
      POSTGRES_USER: ${POSTGRES_USER:-lsbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en backend/.env}
    volumes:
      - lsbot-datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: lsbot-api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-lsbot}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-lsbot}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  lsbot-datos:
